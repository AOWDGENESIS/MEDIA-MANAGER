name: Windows-Installationspaket bauen

# Baut auf echtem Windows sowohl das ZIP-Paket (funktioniert ueberall,
# keine Adminrechte noetig) als auch das echte MSI mit dem WiX-Toolset
# (WiX kann nur unter Windows laufen, siehe deploy/wix/Product.wxs und
# deploy/README.md fuer die Begruendung - daher dieser Workflow statt
# eines lokalen Linux-Builds fuer das MSI).
on:
  workflow_dispatch: {}
  push:
    branches: [main, arena/b54df116-media-manager]  # Arbeitsbranch: Installer ohne Merge nach main bauen
    paths:
      - "deploy/**"
      - "ui-windows-dotnet/**"
      - "core/**"
      - "i18n/**"
      - ".github/workflows/build-windows-installer.yml"

jobs:
  build:
    runs-on: windows-latest
    outputs:
      bundle_id: ${{ steps.bundle_upload.outputs['artifact-id'] }}
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v5

      - name: .NET SDK einrichten
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: .NET-Client-Tests unter Windows
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'dotnet-tests.log'
          dotnet test ui-windows-dotnet/GenesisMediaManager.Client.Tests/GenesisMediaManager.Client.Tests.csproj -c Release -p:EnableWindowsTargeting=true *> $log
          $testExit = $LASTEXITCODE
          Get-Content $log -Tail 100
          if ($testExit -ne 0) {
            # Die Voll-Logs liegen ausserhalb der Sandbox auf einem nicht
            # erreichbaren Host; so werden Fehler ueber die API sichtbar.
            Select-String -Path $log -Pattern 'error|failed|failure|exception|Fehler|fehlgeschlagen' |
              Select-Object -Last 25 | ForEach-Object {
                $msg = ($_.Line -replace '%', '%25') -replace '\r|\n', ' '
                Write-Host "::error::$msg"
              }
            throw ".NET-Client-Tests fehlgeschlagen (Exit-Code $testExit)"
          }

      - name: WiX-Toolset-CLI installieren
        run: dotnet tool install --global wix --version 5.0.2

      - name: Inno Setup 6 bereitstellen
        shell: pwsh
        run: |
          $iscc = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup 6 konnte nicht installiert werden.' }
          }

      - name: Paket bauen (ZIP + MSI + Setup-EXE)
        shell: pwsh
        run: |
          # Lauf protokollieren. Bei Fehlern werden die Fehlerzeilen als
          # GitHub-Annotationen ausgegeben, damit sie ohne Log-Download sichtbar sind.
          $log = Join-Path $env:RUNNER_TEMP "paketbau.log"
          try {
            ./deploy/Build-Package.ps1 -BuildMsi -BuildInno *>&1 | Tee-Object -FilePath $log
          } catch {
            $msg = ($_.Exception.Message -replace '[\r\n]+', ' ') -replace '%', '%25'
            Write-Host "::error::$msg"
            if (Test-Path $log) {
              Select-String -Path $log -Pattern 'error' | Select-Object -Last 12 | ForEach-Object {
                Write-Host ("::error::" + ($_.Line -replace '%', '%25'))
              }
            }
            exit 1
          }

      # Absichtlich KEIN setup-python: die drei Installer muessen ihre
      # mitgelieferte Runtime auch ohne Python auf dem PC starten koennen.
      - name: Offline-Runtime im Paket vor der Installation pruefen
        shell: pwsh
        timeout-minutes: 5
        run: |
          try {
            . ./deploy/installer/Set-OfflineTestEnvironment.ps1
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./deploy/installer/Test-OfflineRuntime.ps1 -InstallDir (Resolve-Path build/package).Path
            if ($LASTEXITCODE -ne 0) { throw "Paket-Runtime nicht offline lauffaehig: $LASTEXITCODE" }
          } catch {
            $message = ($_.Exception.Message -replace '%', '%25') -replace '[\r\n]+', ' '
            Write-Host "::error::Offline-Preflight: $message"
            throw
          }

      - name: Windows-Scan-Schutz und begrenzte PowerShell-Starts pruefen
        shell: pwsh
        run: |
          $python = (Resolve-Path 'build/package/runtime/python/python.exe').Path
          $env:PYTHONPATH = (Resolve-Path 'build/package/backend').Path
          & $python -c 'import subprocess; from genesis_core.processes import media_cli_options; from genesis_core.scanner.scanner import MAX_MEDIA_FILES_PER_SCAN, MAX_HASH_BYTES_PER_SCAN; assert media_cli_options()["creationflags"] == subprocess.CREATE_NO_WINDOW; assert MAX_MEDIA_FILES_PER_SCAN <= 200; assert MAX_HASH_BYTES_PER_SCAN <= 512 * 1024 * 1024'
          if ($LASTEXITCODE -ne 0) { throw 'Windows-Prozessfenster-/Scan-Limits fehlen im Paket' }
          $launcherText = Get-Content deploy/installer/Start-GenesisMediaManager.bat -Raw
          if ($launcherText -match '(?im)^\s*powershell(?:\.exe)?\s' -or
              $launcherText -notmatch 'Check-GenesisCore\.py') {
            throw 'Launcher darf keine PowerShell mehr starten; Python-Health-Check fehlt'
          }
          $probe = (Resolve-Path build/package/installer/Check-GenesisCore.py).Path
          & $python $probe 0
          if ($LASTEXITCODE -ne 2) { throw 'Health-Check akzeptiert ungueltige Versuchszahl' }
          Write-Host '::notice::Windows CREATE_NO_WINDOW, Scan-Limits und PowerShell-freier Launcher geprueft'

      - name: Synthetische Windows-Scan- und Launcher-Regression
        shell: pwsh
        timeout-minutes: 6
        run: |
          $python = (Resolve-Path 'build/package/runtime/python/python.exe').Path
          $backend = (Resolve-Path 'build/package/backend').Path
          $deps = Join-Path $env:RUNNER_TEMP 'genesis-ci-test-deps'
          & $python -m pip install --no-cache-dir --disable-pip-version-check --target $deps 'pytest>=8,<9'
          if ($LASTEXITCODE -ne 0) { throw 'pytest fuer CI-Tests nicht installierbar' }
          $env:PYTHONPATH = "$deps;$backend;$env:GITHUB_WORKSPACE/core"
          & $python -m pytest -q core/tests/test_scan_async.py core/tests/test_scan_safety.py core/tests/test_launcher_health.py
          if ($LASTEXITCODE -ne 0) { throw 'Synthetische Windows-Scan-/Launcher-Tests fehlgeschlagen' }
          # pytest liegt nur in RUNNER_TEMP, NICHT in der ausgelieferten Runtime.

      - name: Mitgelieferte FFmpeg- und Chromaprint-Werkzeuge praktisch pruefen
        shell: pwsh
        timeout-minutes: 3
        run: ./deploy/installer/Smoke-Test-MediaTools.ps1 -PackageDir (Resolve-Path build/package).Path

      - name: Inno-Setup-EXE installieren, Core pruefen und deinstallieren
        shell: pwsh
        timeout-minutes: 25
        run: ./deploy/inno/Smoke-Test-Inno.ps1

      - name: Inno-Installationsassistent mit frei gewaehltem Pfad bedienen
        shell: pwsh
        timeout-minutes: 15
        run: ./deploy/inno/Smoke-Test-Wizard.ps1

      - name: ZIP entpacken, installieren, Core pruefen und deinstallieren
        shell: pwsh
        timeout-minutes: 15
        run: ./deploy/installer/Smoke-Test-Zip.ps1

      - name: MSI regulaer installieren, Core pruefen und deinstallieren
        shell: pwsh
        timeout-minutes: 12
        run: ./deploy/wix/Smoke-Test-Msi.ps1

      # Ein Download fuer alle Installationsvarianten, Bauskript, Anleitung
      # und Quellcode. Der temporaere Ordner liegt auf dem Windows-Runner,
      # nicht im auf 100 MB begrenzten Entwicklungs-Workspace.
      - name: Komplettpaket fuer einen Download zusammenstellen
        shell: pwsh
        run: ./deploy/Build-DownloadBundle.ps1

      - name: Komplettpaketstruktur, SHA-256 und ZIP-Inhalte vor Upload pruefen
        shell: pwsh
        timeout-minutes: 12
        run: ./deploy/Test-DownloadBundle.ps1 -BundleDir (Join-Path $env:RUNNER_TEMP 'GenesisMediaManager-Komplettpaket')

      - name: Komplettpaket als eine ZIP hochladen
        id: bundle_upload
        uses: actions/upload-artifact@v6
        with:
          name: GenesisMediaManager-Komplettpaket-zip
          path: ${{ runner.temp }}/GenesisMediaManager-Komplettpaket/
          if-no-files-found: error
          compression-level: 0

  verify-uploaded-artifact:
    name: Veroeffentlichtes Download-ZIP unabhaengig pruefen
    needs: build
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v5

      - name: Download auf separatem Windows-Runner, SHA-256 und ZIP-CRC pruefen
        shell: pwsh
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.bundle_id }}
        run: ./deploy/Test-PublishedArtifact.ps1 -ArtifactId $env:ARTIFACT_ID
