name: Profile or reference request
description: Request a new language, artifact profile, or reference update.
title: "[Request]: "
labels: ["enhancement"]
body:
  - type: input
    id: requested_scope
    attributes:
      label: Language or artifact
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Reason and concrete review risks
    validations:
      required: true
  - type: textarea
    id: official_references
    attributes:
      label: Official references
      description: Prefer primary-source HTTPS URLs.
