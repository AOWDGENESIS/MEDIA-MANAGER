name: Windows-Installationspaket bauen

# Baut auf echtem Windows sowohl das ZIP-Paket (funktioniert ueberall,
# keine Adminrechte noetig) als auch das echte MSI mit dem WiX-Toolset
# (WiX kann nur unter Windows laufen, siehe deploy/wix/Product.wxs und
# deploy/README.md fuer die Begruendung - daher dieser Workflow statt
# eines lokalen Linux-Builds fuer das MSI).
on:
  workflow_dispatch: {}
  push:
    branches: [main, arena/b54df116-media-manager]  # Arbeitsbranch: Installer ohne Merge nach main bauen
    paths:
      - "deploy/**"
      - "ui-windows-dotnet/**"
      - "core/**"
      - "i18n/**"
      - ".github/workflows/build-windows-installer.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v5

      - name: .NET SDK einrichten
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: .NET-Client-Tests unter Windows
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'dotnet-tests.log'
          dotnet test ui-windows-dotnet/GenesisMediaManager.Client.Tests/GenesisMediaManager.Client.Tests.csproj -c Release -p:EnableWindowsTargeting=true *> $log
          $testExit = $LASTEXITCODE
          Get-Content $log -Tail 100
          if ($testExit -ne 0) {
            # Die Voll-Logs liegen ausserhalb der Sandbox auf einem nicht
            # erreichbaren Host; so werden Fehler ueber die API sichtbar.
            Select-String -Path $log -Pattern 'error|failed|failure|exception|Fehler|fehlgeschlagen' |
              Select-Object -Last 25 | ForEach-Object {
                $msg = ($_.Line -replace '%', '%25') -replace '\r|\n', ' '
                Write-Host "::error::$msg"
              }
            throw ".NET-Client-Tests fehlgeschlagen (Exit-Code $testExit)"
          }

      - name: WiX-Toolset-CLI installieren
        run: dotnet tool install --global wix --version 5.0.2

      - name: Inno Setup 6 bereitstellen
        shell: pwsh
        run: |
          $iscc = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup 6 konnte nicht installiert werden.' }
          }

      - name: Paket bauen (ZIP + MSI + Setup-EXE)
        shell: pwsh
        run: |
          # Lauf protokollieren. Bei Fehlern werden die Fehlerzeilen als
          # GitHub-Annotationen ausgegeben, damit sie ohne Log-Download sichtbar sind.
          $log = Join-Path $env:RUNNER_TEMP "paketbau.log"
          try {
            ./deploy/Build-Package.ps1 -BuildMsi -BuildInno *>&1 | Tee-Object -FilePath $log
          } catch {
            $msg = ($_.Exception.Message -replace '[\r\n]+', ' ') -replace '%', '%25'
            Write-Host "::error::$msg"
            if (Test-Path $log) {
              Select-String -Path $log -Pattern 'error' | Select-Object -Last 12 | ForEach-Object {
                Write-Host ("::error::" + ($_.Line -replace '%', '%25'))
              }
            }
            exit 1
          }

      - name: Python 3.11 fuer den Installations-Smoke-Test bereitstellen
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Inno-Setup-EXE installieren, Core pruefen und deinstallieren
        shell: pwsh
        timeout-minutes: 20
        run: ./deploy/inno/Smoke-Test-Inno.ps1

      - name: ZIP entpacken, installieren, Core pruefen und deinstallieren
        shell: pwsh
        timeout-minutes: 15
        run: ./deploy/installer/Smoke-Test-Zip.ps1

      - name: MSI regulaer installieren, Core pruefen und deinstallieren
        shell: pwsh
        timeout-minutes: 12
        run: ./deploy/wix/Smoke-Test-Msi.ps1

      # Ein Download fuer alle Installationsvarianten, Bauskript, Anleitung
      # und Quellcode. Der temporaere Ordner liegt auf dem Windows-Runner,
      # nicht im auf 100 MB begrenzten Entwicklungs-Workspace.
      - name: Komplettpaket fuer einen Download zusammenstellen
        shell: pwsh
        run: ./deploy/Build-DownloadBundle.ps1

      - name: Komplettpaket als eine ZIP hochladen
        uses: actions/upload-artifact@v6
        with:
          name: GenesisMediaManager-Komplettpaket-zip
          path: ${{ runner.temp }}/GenesisMediaManager-Komplettpaket/
          if-no-files-found: error
          compression-level: 0
